<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PostHog QUILL Impact Dashboard</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{--bg:#0d0b08;--border:rgba(255,255,255,.12);--text:#fff7ed;--muted:#b8aa9a;--orange:#f97316;--amber:#f59e0b;--green:#22c55e;--red:#ef4444;--blue:#38bdf8;--purple:#a78bfa;}
*{box-sizing:border-box;}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:radial-gradient(circle at top left,rgba(249,115,22,.34),transparent 32%),radial-gradient(circle at top right,rgba(167,139,250,.18),transparent 28%),linear-gradient(135deg,#100b06 0%,#17130f 45%,#090807 100%);
color:var(--text);min-height:100vh;}
.app{max-width:1480px;margin:0 auto;padding:22px;}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:16px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:14px;}
.hog{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#fff7ed,#f97316);display:grid;place-items:center;color:#1f1308;font-size:29px;box-shadow:0 18px 50px rgba(249,115,22,.25);}
h1,h2,h3,p{margin:0;}
.eyebrow{color:var(--orange);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.12em;}
h1{font-size:30px;line-height:1.04;letter-spacing:-.05em;}
.subtle{color:var(--muted);font-size:13.5px;line-height:1.45;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.pill{border:1px solid var(--border);background:rgba(255,255,255,.07);border-radius:999px;padding:9px 12px;color:var(--text);font-size:13px;font-weight:700;backdrop-filter:blur(16px);}
.pill.live{border-color:rgba(34,197,94,.4);color:#86efac;background:rgba(34,197,94,.1);}
.grid{display:grid;grid-template-columns:390px 1fr;gap:18px;align-items:start;}
.panel{border:1px solid var(--border);background:linear-gradient(180deg,rgba(255,247,237,.105),rgba(255,247,237,.045));border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.22);backdrop-filter:blur(22px);}
.leaderboard{padding:16px;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;}
.leader-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;}
.leader-card{width:100%;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.055);color:var(--text);border-radius:18px;padding:13px;margin-bottom:10px;cursor:pointer;text-align:left;transition:all .2s;position:relative;overflow:hidden;}
.leader-card:hover{transform:translateY(-2px);background:rgba(255,255,255,.09);border-color:rgba(249,115,22,.32);}
.leader-card.active{border-color:rgba(249,115,22,.72);background:linear-gradient(135deg,rgba(249,115,22,.20),rgba(255,255,255,.065));box-shadow:inset 0 0 0 1px rgba(249,115,22,.18),0 18px 45px rgba(249,115,22,.12);}
.leader-row{display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center;}
.avatar{width:42px;height:42px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.name{font-weight:900;letter-spacing:-.02em;}
.role{color:var(--muted);font-size:12px;margin-top:2px;}
.score{font-size:26px;font-weight:950;letter-spacing:-.06em;color:#fff;text-align:right;}
.small-label{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;}
.rankline{display:flex;justify-content:space-between;gap:8px;margin-top:10px;align-items:center;}
.velocity{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:850;padding:6px 9px;border-radius:999px;}
.velocity.green{background:rgba(34,197,94,.13);color:#86efac;border:1px solid rgba(34,197,94,.28);}
.velocity.red{background:rgba(239,68,68,.13);color:#fca5a5;border:1px solid rgba(239,68,68,.26);}
.velocity.amber{background:rgba(245,158,11,.13);color:#fcd34d;border:1px solid rgba(245,158,11,.28);}
.mini-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:64px;align-items:end;height:24px;}
.mini-bars span{display:block;border-radius:999px 999px 2px 2px;min-height:4px;}
.mini-bars.green span{background:linear-gradient(180deg,#86efac,rgba(34,197,94,.35));}
.mini-bars.red span{background:linear-gradient(180deg,#fca5a5,rgba(239,68,68,.35));}
.mini-bars.amber span{background:linear-gradient(180deg,#fcd34d,rgba(245,158,11,.35));}
.show-more{width:100%;border:1px dashed rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:var(--text);border-radius:16px;padding:12px;cursor:pointer;font-weight:800;margin-top:7px;}
.profile{display:grid;gap:18px;}
.hero{padding:20px;display:grid;grid-template-columns:1.2fr .8fr;gap:18px;overflow:hidden;position:relative;}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 76% 8%,rgba(249,115,22,.26),transparent 28%);pointer-events:none;}
.hero-main{position:relative;z-index:1;display:flex;gap:16px;align-items:center;}
.hero-avatar{width:86px;height:86px;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 40px rgba(0,0,0,.28);background:rgba(255,255,255,.1);flex-shrink:0;}
.hero-avatar img{width:100%;height:100%;object-fit:cover;}
.hero-name{font-size:34px;line-height:1;font-weight:950;letter-spacing:-.07em;margin:5px 0 7px;}
.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1;}
.stat{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.11);border-radius:18px;padding:13px;}
.stat-value{font-size:26px;font-weight:950;letter-spacing:-.06em;}
.stat-value.red{color:#fca5a5;} .stat-value.green{color:#86efac;}
.section-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;}
.section{padding:18px;}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;}
.quill-row{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.05);border-radius:18px;margin-bottom:10px;overflow:hidden;}
.quill-button{width:100%;background:transparent;color:var(--text);border:none;padding:14px;cursor:pointer;display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;text-align:left;}
.letter{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-weight:950;color:#120b04;background:linear-gradient(135deg,#fff7ed,#fb923c);}
.bar-wrap{height:10px;background:rgba(255,255,255,.10);border-radius:999px;margin-top:8px;overflow:hidden;}
.bar{height:100%;border-radius:999px;background:linear-gradient(90deg,#f97316,#f59e0b);}
.quill-score{font-size:22px;font-weight:950;letter-spacing:-.05em;}
.details{padding:0 14px 14px 14px;color:var(--muted);}
.driver-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:11px;}
.driver{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.045);border-radius:14px;padding:9px;}
.driver strong{color:var(--text);display:block;font-size:13px;}
.summary-box{background:linear-gradient(135deg,rgba(249,115,22,.18),rgba(167,139,250,.10));border:1px solid rgba(249,115,22,.22);border-radius:20px;padding:16px;line-height:1.55;color:#fef3c7;font-size:13.5px;}
.summary-box b{color:#fff;}
.compare-table{width:100%;border-collapse:collapse;font-size:13px;}
.compare-table th,.compare-table td{padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;}
.delta-pos{color:#86efac;font-weight:900;} .delta-neg{color:#fca5a5;font-weight:900;}
.chart-card{display:flex;flex-direction:column;justify-content:space-between;}
svg{overflow:visible;}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:800;margin-top:8px;}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:6px;}
.ownership-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.system-card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);border-radius:18px;padding:13px;}
.insights-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}
.insight{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);border-radius:18px;padding:12px;}
.insight-number{font-size:22px;font-weight:950;letter-spacing:-.05em;}
.network{position:relative;min-height:280px;}
.node{position:absolute;transform:translate(-50%,-50%);padding:9px 11px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);font-size:12px;font-weight:900;white-space:nowrap;}
.node.core{background:linear-gradient(135deg,rgba(249,115,22,.95),rgba(245,158,11,.95));color:#1c1007;box-shadow:0 15px 45px rgba(249,115,22,.25);font-size:13px;max-width:150px;text-align:center;white-space:normal;}
.line{position:absolute;height:1px;background:rgba(249,115,22,.35);transform-origin:left center;}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.tab{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.10);color:var(--muted);border-radius:999px;padding:8px 11px;cursor:pointer;font-weight:800;font-size:12px;}
.tab.active{color:#fff;background:rgba(249,115,22,.18);border-color:rgba(249,115,22,.35);}
.timeline{display:grid;gap:10px;}
.event{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.045);border-radius:16px;padding:10px;text-decoration:none;color:inherit;}
.event:hover{border-color:rgba(249,115,22,.4);background:rgba(255,255,255,.07);}
.commit-tag{color:#93c5fd;background:rgba(59,130,246,.13);border:1px solid rgba(59,130,246,.20);border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;white-space:nowrap;}
.prov{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;}
.estbadge{font-size:11px;color:#fcd34d;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);border-radius:999px;padding:3px 8px;font-weight:800;}
a.inline{color:#fdba74;}
@media (max-width:1050px){.grid,.hero,.section-grid{grid-template-columns:1fr;}.leaderboard{position:relative;max-height:none;}.ownership-grid,.insights-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:650px){.app{padding:14px;}.topbar{align-items:flex-start;flex-direction:column;}.quick-stats,.ownership-grid,.insights-grid,.driver-grid{grid-template-columns:1fr;}.event{grid-template-columns:1fr;}.hero-main{align-items:flex-start;flex-direction:column;}}

function LineChart({eng,tt,t5}){const w=620,h=190,pad=24;

function Network({core}){const nodes=[{label:core,x:50,y:50,core:true},{label:"Feature flags",x:18,y:26},{label:"Analytics",x:78,y:24},{label:"Experiments",x:80,y:70},{label:"Session replay",x:24,y:76},{label:"Data pipeline",x:50,y:90}];

  return ()=>{on=false;};},[eng.id]);
 const b=s.loading?{t:"\u25CF Generating with Claude\u2026",c:"#fcd34d"}:s.live?{t:"\u25CF Live \u00B7 generated by Claude",c:"#86efac"}:{t:"\u25CF Precomputed \u00B7 add ANTHROPIC_API_KEY for live",c:"#b8aa9a"};

function leverageFallback(e){
 var fp=e.footprint||[], m=e.metrics||{}, top=fp[0];

 if(!fp.length || (m.merged && footSum/m.merged<0.15)) where="spread broadly across the codebase, beyond any single product surface";

 </div>;

      <ManagerSummary eng={sel} first={first}/>
      <table className="compare-table" style={{marginTop:14}}>
       <thead><tr><th>Driver</th><th>{first}</th><th>Team avg</th><th>Gap</th></tr></thead>
       <tbody>{QKEYS.map(k=>{const g=sel.scores[k]-teamAvg[k];return <tr key={k}><td>{k}</td><td>{sel.scores[k]}</td><td>{teamAvg[k]}</td><td className={g>=0?"delta-pos":"delta-neg"}>{g>=0?"+":""}{g}</td></tr>;})}</tbody></table>
     </section>
    </div>
    <div className="section-grid">
     <section className="panel section">
      <div className="section-title"><div><div className="eyebrow">Momentum over time</div><h2>Velocity trend</h2></div><span className={`velocity ${vClass(sel.velocity)}`}>{sel.velocity>=0?"▲":"▼"} {Math.abs(sel.velocity)}%</span></div>
      <LineChart eng={sel} tt={teamTrend} t5={top5Trend}/>
      {sel.est && <p className="subtle" style={{marginTop:8}}>Note: last-30-day rate is exact; the 31-60 / 61-90 split shown here is estimated for this engineer (60-day count not retrieved before API rate-limit).</p>}
     </section>
     <LeverageCard eng={sel}/>
    </div>
    <section className="panel section">
     <div className="section-title"><div><div className="eyebrow">Engineering manager overview</div><h2>Ownership & GitHub insights</h2></div><span className="pill">90-day signals</span></div>
     <div className="ownership-grid">{sel.ownership.map(([s,desc,n,unit])=>(
      <div className="system-card" key={s}><div className="name">{s}</div><p className="subtle">{desc}</p>
       <div style={{marginTop:10}}><span className="stat-value" style={{fontSize:24}}>{n}</span><span className="subtle"> {unit}</span></div></div>))}</div>
     <div className="insights-grid" style={{marginTop:14}}>{sel.insights.map(([n,num,desc])=>(
      <div className="insight" key={n}><div className="small-label">{n}</div><div className="insight-number">{num}</div><p className="subtle">{desc}</p></div>))}</div>
    </section>
    <section className="panel section">
     <div className="section-title"><div><div className="eyebrow">Evidence drill-down</div><h2>Contribution evidence</h2></div><span className="pill">Links to GitHub</span></div>
     <div className="tabs">{["all","Users","Quality","Leadership","Impact"].map(t=><button key={t} className={`tab ${tab===t?"active":""}`} onClick={()=>setTab(t)}>{t==="all"?"All":t}</button>)}</div>
     <div className="timeline">{sel.events.filter(([l,d,tg])=>tab==="all"||tg===tab).map(([label,desc,tg,url],i)=>(
      <a className="event" key={i} href={url} target="_blank" rel="noreferrer">
       <span className="small-label">{label}</span>
       <div><div className="name">{desc}</div><p className="subtle">Opens the matching merged-PR / review query on GitHub for {sel.name}.</p></div>
       <span className="commit-tag">{tg}</span></a>))}</div>
     <div className="prov">
      <b>How this is computed.</b> Every number is a real count from the GitHub REST + Search API over {WIN.since} → {WIN.until} ({WIN.days} days) on {WIN.repo} ({WIN.total_merged_prs.toLocaleString()} merged PRs).
      The cohort is the repo's most active engineers in the window. Each QUILL driver is a z-score of real signals (merged PRs, feature/fix/maintenance PR mix, reviews given on others' PRs) scaled so <b>50 = team average</b>; the QUILL score is the mean of the five drivers. Lines of code and raw commit counts are deliberately excluded.
      Approval rate (~100%) and formal change-requests (~0) are uniform across the team under PostHog's enforced-review + AI-review workflow, so Quality is measured as active reliability work rather than the gate. The dependency surface is illustrative.
     </div>
    </section>
   </main>
  </div></div>;}
function Root(){
 const [st,setSt]=React.useState({D:SNAPSHOT,src:SNAPSHOT.source||"snapshot",loading:true});
 React.useEffect(()=>{let on=true;
  fetch("/api/quill").then(r=>r.json()).then(j=>{
   if(on&&j&&j.engineers&&j.engineers.length){setSt({D:j,src:j.source||"live",loading:false});}
   else setSt(s=>({...s,loading:false}));
  }).catch(()=>setSt(s=>({...s,loading:false})));
  return ()=>{on=false;};},[]);
 return <App D={st.D} src={st.src} loading={st.loading}/>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script></body></html>
